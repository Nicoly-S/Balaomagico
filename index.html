<style>
:root{
  color-scheme:light;
  --ameixa:#5b3a8c;   /* botão principal, título */
  --lavanda:#b48fdc;  /* detalhes */
  --sol:#f3c933;      /* foco, estrela */
  --ceu:#c9f1e9;      /* topo do céu */
  --tinta:#2a2433;    /* texto */
  --nevoa:#6b6079;    /* texto secundário */
  --linha:#ebe3f5;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;
  font-family:'Baloo 2',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--tinta);line-height:1.35;
  background:linear-gradient(180deg,var(--ceu) 0%,#eaf8f5 36%,#f6f1fb 72%,#efe5fa 100%);
  background-color:#eef8f5;
  overflow-x:hidden;
}
a{color:inherit;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid var(--sol);outline-offset:3px}

.ceu{position:fixed;inset:0;pointer-events:none;z-index:0}
.nuvem{position:absolute;fill:#fff}
.n1{width:150px;top:7%;left:-34px;opacity:.9}
.n2{width:110px;top:21%;right:-22px;opacity:.75}
.n3{width:190px;bottom:9%;left:-60px;opacity:.55}

main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:36px 16px 28px}

.topo{text-align:center}
.balao{width:188px;height:188px;margin:0 auto;display:block;
  filter:drop-shadow(0 18px 22px rgba(91,58,140,.22));
  animation:sobe 1.1s cubic-bezier(.2,.9,.3,1.1) both, flutua 6s ease-in-out 1.1s infinite}
.bm-logo{width:100%;height:100%;display:block}
@keyframes sobe{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin:18px 0 0;font-size:34px;line-height:1.05;font-weight:800;color:var(--ameixa);letter-spacing:-.01em}
.frase{margin:6px 0 0;font-size:18px;font-weight:500;color:var(--nevoa)}

.pedido{display:flex;align-items:center;gap:14px;margin-top:28px;padding:16px 18px;border-radius:20px;
  background:var(--ameixa);color:#fff;text-decoration:none;
  box-shadow:0 14px 26px -14px rgba(91,58,140,.8);transition:transform .12s ease,background .15s ease}
.pedido:active{transform:scale(.98)}
@media (hover:hover){.pedido:hover{background:#6a47a0}}
.pedido .ic{flex:0 0 48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pedido .ic svg{width:30px;height:30px}
.pedido strong{display:block;font-size:19px;font-weight:700;line-height:1.15}
.pedido small{display:block;font-size:14px;opacity:.85;margin-top:2px}

.painel{margin-top:16px;border-radius:24px;background:rgba(255,255,255,.84);
  box-shadow:0 12px 30px -20px rgba(75,46,107,.5),inset 0 0 0 1px rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:15px 18px;text-decoration:none;transition:background .12s ease}
.item+.item{border-top:1px solid var(--linha)}
.item:active{background:#f4eefb}
@media (hover:hover){.item:hover{background:#f8f4fd}}
.item svg{flex:0 0 26px;width:26px;height:26px}
.item span{flex:1;min-width:0}
.item strong{display:block;font-size:17px;font-weight:700}
.item small{display:block;font-size:14px;color:var(--nevoa);margin-top:1px}

footer{margin-top:30px;text-align:center;font-size:14px;color:var(--nevoa)}

.bolinha{position:absolute;display:block;border-radius:50%;opacity:.6;animation:boia 9s ease-in-out infinite}
.bolinha.q{border-radius:5px;transform:rotate(45deg)}
@keyframes boia{0%,100%{translate:0 0}50%{translate:0 -18px}}
.estrela{position:fixed;left:0;top:0;z-index:50;pointer-events:none;line-height:1;font-size:var(--t);color:var(--c);
  text-shadow:0 0 8px var(--c),0 0 2px rgba(42,36,51,.35);animation:brilha 1.1s ease-out forwards;will-change:transform,opacity}
@keyframes brilha{
  0%{transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(.2) rotate(140deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bolinha{animation:none}.balao{animation:none}.pedido,.item{transition:none}}
</style>

<script>
/* Rastro de estrelas seguindo o mouse (e o dedo no celular) */
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cores = ['#f3c933', '#f3c933', '#b48fdc', '#4fc7b5', '#f08bb0'];
  var formas = ['\u2726', '\u2605', '\u2727'];
  var ultimo = null, vivas = 0;
  function estrela(x, y) {
    if (vivas > 40) return;
    var e = document.createElement('span');
    e.className = 'estrela';
    e.setAttribute('aria-hidden', 'true');
    e.textContent = formas[Math.random() * formas.length | 0];
    e.style.setProperty('--x', x + 'px');
    e.style.setProperty('--y', y + 'px');
    e.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
    e.style.setProperty('--dy', (Math.random() * 26 + 10) + 'px');
    e.style.setProperty('--t', (16 + Math.random() * 12) + 'px');
    e.style.setProperty('--c', cores[Math.random() * cores.length | 0]);
    vivas++;
    e.addEventListener('animationend', function () { e.remove(); vivas--; });
    document.body.appendChild(e);
  }
  window.addEventListener('pointermove', function (ev) {
    var x = ev.clientX, y = ev.clientY;
    if (ultimo && Math.hypot(x - ultimo[0], y - ultimo[1]) < 12) return;
    ultimo = [x, y];
    estrela(x, y);
  }, { passive: true });
  window.addEventListener('pointerdown', function (ev) {
    for (var i = 0; i < 6; i++) estrela(ev.clientX, ev.clientY);
  }, { passive: true });
})();
</script>
